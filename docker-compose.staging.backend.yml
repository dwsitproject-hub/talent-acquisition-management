# Staging — Backend server (Redis + API). PostgreSQL lives on ApsaraDB RDS after cutover.
#
# Default (ApsaraDB): requires DATABASE_URL in the env file.
#   docker compose -f docker-compose.staging.backend.yml --env-file .env.staging.backend -p tas-staging up -d
#
# Before the RDS cutover, or to roll back to local Postgres 15, add the profile:
#   docker compose -f docker-compose.staging.backend.yml --env-file .env.staging.backend -p tas-staging --profile local-db up -d
# and set DATABASE_URL host to `postgres` (sslmode=disable). Keep the volume for >= 7 days after cutover.
#
# Encode special characters in DATABASE_URL via: ./scripts/setup-database-url.sh .env.staging.backend

services:
  postgres:
    profiles: ["local-db"]
    image: postgres:15-alpine
    container_name: tas_staging_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tas_db}
      PGPORT: ${POSTGRES_PORT}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
      - ./backups:/backups
    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_PORT}"
    networks:
      - tas_staging_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tas_user} -d ${POSTGRES_DB:-tas_db} -p ${POSTGRES_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tas_staging_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: ${REDIS_PORT}
    command: >
      redis-server
      --port ${REDIS_PORT}
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_staging_data:/data
    ports:
      - "${REDIS_HOST_PORT}:${REDIS_PORT}"
    networks:
      - tas_staging_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p $${REDIS_PORT} -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: tas_staging_backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-staging}
      PORT: ${BACKEND_PORT}
      # ApsaraDB RDS (or local postgres when --profile local-db). Must be URL-encoded.
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL}
      CANDIDATE_PORTAL_URL: ${CANDIDATE_PORTAL_URL}
      API_BASE_URL: ${API_BASE_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      CORS_CREDENTIALS: ${CORS_CREDENTIALS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-5000}
      RATE_LIMIT_LOGIN_WINDOW: ${RATE_LIMIT_LOGIN_WINDOW:-900000}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-50}
      PRISMA_MIGRATE_ON_START: ${PRISMA_MIGRATE_ON_START:-true}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      ALLOWED_FILE_TYPES: ${ALLOWED_FILE_TYPES:-pdf,doc,docx,jpg,jpeg,png,xls,xlsx}
      # Synology staging: /mnt/synology/dev/TAS — do not set STORAGE_LOCAL_PATH / UPLOAD_DIR
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_SYNOLOGY_ROOT: ${STORAGE_SYNOLOGY_ROOT:-/mnt/synology}
      STORAGE_DEPLOYMENT: ${STORAGE_DEPLOYMENT:-dev}
      STORAGE_PROJECT_SLUG: ${STORAGE_PROJECT_SLUG:-TAS}
      # DWS Hub OIDC — routes stay 404 until all three required vars are set
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      # SMTP — interpolated from the staging env file. Required for onboarding reminders.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_PASS: ${SMTP_PASS:-${SMTP_PASSWORD:-}}
      EMAIL_FROM: ${EMAIL_FROM:-${SMTP_FROM_EMAIL:-}}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      SMTP_REJECT_UNAUTHORIZED: ${SMTP_REJECT_UNAUTHORIZED:-true}
    ports:
      - "${BACKEND_HOST_PORT}:${BACKEND_PORT}"
    volumes:
      # Host NAS share → container path used by STORAGE_SYNOLOGY_ROOT. Recreate the container after changing this.
      - ${STORAGE_HOST_MOUNT:-/mnt/synology}:${STORAGE_SYNOLOGY_ROOT:-/mnt/synology}
      - ./backend/logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - tas_staging_network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:' + (process.env.PORT || '4000') + '/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_staging_data:
    driver: local
  redis_staging_data:
    driver: local

networks:
  tas_staging_network:
    driver: bridge
