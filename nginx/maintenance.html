<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>KPN Talent Acquisition — Under maintenance</title>
  <style>
    :root {
      --brand: #C43A31;
      --text: #2B2B2B;
      --muted: #6B6B6B;
      --bg: #FAFAFA;
      --card: #FFFFFF;
      --border: #E0E0E0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .panel {
      max-width: 28rem;
      text-align: center;
    }
    .icon {
      width: 4rem;
      height: 4rem;
      margin: 0 auto 1.5rem;
      border-radius: 1rem;
      background: var(--card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg { width: 2rem; height: 2rem; stroke: var(--brand); }
    .eyebrow {
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--brand);
      margin: 0 0 0.75rem;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      margin: 0 0 1rem;
      line-height: 1.2;
    }
    p { margin: 0; color: var(--muted); line-height: 1.6; font-size: 1rem; }
    button {
      margin-top: 2rem;
      padding: 0.625rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: #fff;
      background: var(--brand);
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
    }
    button:hover { opacity: 0.92; }
    .footnote { margin-top: 2.5rem; font-size: 0.75rem; color: var(--muted); }
  </style>
</head>
<body>
  <main class="panel">
    <div class="icon" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17 17.25 21A2.652 2.652 0 0 0 21 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 1 1-3.586-3.586l6.837-5.63m5.108-.233c.55-.164 1.163-.198 1.743-.14a4.5 4.5 0 0 0 4.486-6.336l-3.776 3.777a3 3 0 0 1-3.639 3.639l-3.776 3.776a4.5 4.5 0 0 0-6.336 4.486c.091 1.076-.071 2.264-.904 2.95l-.102.085m-1.745 1.437L5.909 7.5H4.5L2.25 3.75l1.5-1.5L7.5 4.5v1.409l4.26 4.26m-1.745 1.437 1.745-1.437m6.615 6.615 1.745-1.437" />
      </svg>
    </div>
    <p class="eyebrow">Under maintenance</p>
    <h1>We&rsquo;ll be back shortly</h1>
    <p>
      KPN Talent Acquisition System is temporarily unavailable while we restore our services.
      Please try again in a few minutes.
    </p>
    <button type="button" onclick="window.location.reload()">Try again</button>
    <p class="footnote">If this persists, contact your HR or IT support team.</p>
  </main>
</body>
</html>
